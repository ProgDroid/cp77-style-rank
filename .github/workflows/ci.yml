name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: Lint Lua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 luarocks
          sudo luarocks install luacheck

      - name: Run luacheck
        run: luacheck init.lua

  shell:
    name: Lint shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # shellcheck ships on the GitHub-hosted runner image.
      - name: Run shellcheck
        run: shellcheck scripts/update-deps.sh

  deps:
    name: Verify vendored dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fails if anything under cet-kit/ no longer matches deps.lock, which is how
      # a hand-edit to vendored code gets caught before it is merged.
      - name: Check cet-kit against deps.lock
        run: ./scripts/update-deps.sh --check
